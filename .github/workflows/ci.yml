name: CI · InsightLab Studio

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Quality, security baseline, regression and UI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest httpx playwright
      - name: Audit repository for private files and obvious secrets
        run: python scripts/audit_release.py
      - name: Compile Python and check frontend syntax
        run: |
          python -m compileall -q backend
          find insightlab_mvp -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Node regression tests
        run: |
          node tests/stage1_integrity.test.cjs
          node tests/stage2_query_engine.test.cjs
          node tests/stage2_business_fixtures.test.cjs
      - name: FastAPI security regression
        run: python -m pytest -q tests/test_backend_security.py tests/test_i18n_backend.py
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser smoke tests (no external AI calls)
        run: |
          python tests/ui_smoke_stage1.py
          python tests/ui_smoke_stage2.py
          python tests/test_i18n_ui.py
      - name: Runtime package sanity
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'backend')
          from app import app
          from fastapi.testclient import TestClient
          response = TestClient(app).get('/api/health')
          assert response.status_code == 200, response.text
          print('OK: /api/health', response.json())
          PY
